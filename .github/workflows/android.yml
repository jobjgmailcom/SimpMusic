name: Legacy release build (disabled in Echo Brain FOSS fork)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Generate aboutLibraries.json
        run: ./gradlew exportLibraryDefinitions

      - name: Legacy source check only
        run: ./gradlew :domain:jvmTest --no-daemon --max-workers=1
