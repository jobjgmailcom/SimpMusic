name: Echo Brain FOSS APK

on:
  workflow_dispatch:
  push:
    branches: [echo-brain-v1.7]
  pull_request:
    branches: [echo-brain-v1.7]

permissions:
  contents: read

jobs:
  build-foss:
    name: Test, build and audit FOSS APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sources and extractor submodules
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install Android platform used by SimpMusic
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;35.0.0"

      - name: Verify FOSS configuration
        run: |
          test "$(grep '^isFullBuild=' gradle.properties)" = "isFullBuild=false"
          ! grep -q 'sentry.gradle' androidApp/build.gradle.kts

      - name: Test Echo Brain planner
        run: ./gradlew :domain:jvmTest --no-daemon --max-workers=1

      - name: Assemble unsigned-secret-free Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --max-workers=1

      - name: Audit APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find androidApp/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep "package: name='com.maxrave.simpmusic.dev'"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK" | grep 'Verified using v2 scheme (APK Signature Scheme v2): true'
          unzip -p "$APK" 'classes*.dex' > app.dex
          for forbidden in 'Lcom/google/firebase' 'Lcom/google/android/gms' 'io/sentry' 'io.sentry'; do
            if grep -aFq "$forbidden" app.dex; then
              echo "FOSS audit failed: $forbidden is packaged"
              exit 1
            fi
          done
          if grep -aFq 'ws.audioscrobbler.com' app.dex; then
            echo 'FOSS audit failed: real Last.fm endpoint is packaged'
            exit 1
          fi
          sha256sum "$APK" | tee apk.sha256
          unzip -l "$APK" | awk '/lib\/[^/]+\/.*\.so/ {split($4,a,"/"); print a[2]}' | sort -u | xargs echo 'ABIs:'

      - name: Publish FOSS APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: SimpMusic-Echo-Brain-FOSS-debug
          if-no-files-found: error
          path: |
            androidApp/build/outputs/apk/debug/*.apk
            apk.sha256
